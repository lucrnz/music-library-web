# Alembic config for musicweb (script location under package).
# Runtime migrations are applied by musicweb.db.engine.init_database;
# this file is for optional CLI use: `alembic upgrade head`.

[alembic]
script_location = src/musicweb/db/migrations
prepend_sys_path = .
version_path_separator = os

sqlalchemy.url = sqlite:///./data/library.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
