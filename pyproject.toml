[project]
name = "musicweb"
version = "0.1.0"
description = "Browse and stream a lossless music library over the LAN (Foobar-style UI)."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Luciano Hillcoat", email = "me@lucdev.net" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "mutagen>=1.48.1",
    "pillow>=11.0.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "typer>=0.27.1",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
musicweb = "musicweb:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
